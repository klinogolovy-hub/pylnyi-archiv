<style>
/* Layout: 4:3 pixel screen on top, thumb controls below (d-pad left, action buttons right).
   One deliberate dark look: a lantern-lit library, ember accent, teal reserved for mercy. */
:root {
  --bg: #0d0b14;
  --panel: #171322;
  --line: #3a3354;
  --paper: #f1e6c8;
  --ember: #ffb347;
  --mercy: #8fe3d0;
  --dim: #8d85a8;
  --ink: #241a33;
  --font-ui: "Pixelify Sans", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  background: var(--bg);
  color: var(--paper);
  font-family: var(--font-ui);
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#screen {
  display: block;
  width: min(100%, calc((100dvh - 260px) * 4 / 3));
  min-width: 240px;
  aspect-ratio: 4 / 3;
  image-rendering: pixelated;
  background: #000;
  border: 2px solid var(--line);
  touch-action: none;
}
#pad {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
}
#dpad {
  display: grid;
  grid-template-columns: repeat(3, clamp(46px, 14vw, 58px));
  grid-template-rows: repeat(3, clamp(46px, 14vw, 58px));
  gap: 4px;
}
.k-up { grid-area: 1 / 2; }
.k-left { grid-area: 2 / 1; }
.k-right { grid-area: 2 / 3; }
.k-down { grid-area: 3 / 2; }
button.ctl {
  font: 600 18px var(--font-ui);
  color: var(--paper);
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 6px;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}
button.ctl.on { background: #2a2340; border-color: var(--ember); }
button:focus-visible { outline: 2px solid var(--mercy); outline-offset: 2px; }
#acts {
  display: flex;
  align-items: flex-end;
  gap: 12px;
}
#b-z {
  width: clamp(70px, 21vw, 88px);
  height: clamp(70px, 21vw, 88px);
  margin-bottom: 26px;
  border-radius: 50%;
  background: var(--ember);
  color: var(--ink);
  border-color: #ffd59a;
  font-size: 22px;
}
#b-z.on { background: #ffd59a; }
#b-x {
  width: clamp(56px, 16vw, 70px);
  height: clamp(56px, 16vw, 70px);
  border-radius: 50%;
  font-size: 13px;
}
#snd {
  min-height: 36px;
  padding: 0 14px;
  font-size: 13px;
  color: var(--dim);
}
</style>

<script>
(function () {
'use strict';

/* ---------- constants ---------- */
const W = 320, H = 240;
const FF = '"Pixelify Sans", ui-monospace, Menlo, monospace';
const FONT = '12px ' + FF;
const FONT_S = '10px ' + FF;
const FONT_L = '30px ' + FF;
const C = {
  ink: '#241a33', bg: '#0b0812', paper: '#f1e6c8', ember: '#ffb347', mercy: '#8fe3d0',
  dim: '#8d85a8', danger: '#ff6b6b', floor1: '#1d1830', floor2: '#221c38',
  wall: '#120e1c', wallHi: '#261f3b'
};
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
let S = 2;
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  S = Math.max(1, Math.round((r.width || W) * dpr / W));
  cv.width = W * S;
  cv.height = H * S;
}
window.addEventListener('resize', fit);
fit();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ---------- audio ---------- */
let AC = null, muted = false, track = 'world', mstep = 0;
function ensureAudio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
}
function beep(f, d, type, v, slide) {
  if (!AC || muted) return;
  try {
    d = d || 0.06; v = v == null ? 0.05 : v;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const TRACKS = {
  world: [220, 0, 261.6, 0, 329.6, 0, 261.6, 0, 196, 0, 246.9, 0, 293.7, 0, 246.9, 0],
  battle: [293.7, 0, 349.2, 293.7, 440, 0, 349.2, 0, 261.6, 0, 311.1, 261.6, 392, 0, 311.1, 0],
  quiet: [196, 0, 0, 0, 246.9, 0, 0, 0]
};
setInterval(function () {
  if (!AC || muted) return;
  const tr = TRACKS[track] || TRACKS.world;
  const n = tr[mstep++ % tr.length];
  if (n) beep(n, track === 'battle' ? 0.22 : 0.4, 'triangle', 0.03);
}, 230);
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', function () {
  ensureAudio();
  muted = !muted;

});

/* ---------- input ---------- */
const held = { up: false, down: false, left: false, right: false };

function bindBtn(id, key) {
  const el = document.getElementById(id);
  const dn = function (e) {
    e.preventDefault();
    ensureAudio();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    if (key in held) held[key] = true;
    el.classList.add('on');
    press(key);
  };
  const up = function (e) {
    e.preventDefault();
    if (key in held) held[key] = false;
    el.classList.remove('on');
  };
  el.addEventListener('pointerdown', dn);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bindBtn('b-up', 'up'); bindBtn('b-down', 'down'); bindBtn('b-left', 'left'); bindBtn('b-right', 'right');
bindBtn('b-z', 'z'); bindBtn('b-x', 'x');

const CODEMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
  KeyZ: 'z', Enter: 'z', Space: 'z', KeyX: 'x', Escape: 'x', ShiftLeft: 'x', ShiftRight: 'x'
};
window.addEventListener('keydown', function (e) {
  const k = CODEMAP[e.code];
  if (!k) return;
  e.preventDefault();
  ensureAudio();
  if (k in held) { if (!held[k]) { held[k] = true; press(k); } }
  else if (!e.repeat) press(k);
});
window.addEventListener('keyup', function (e) {
  const k = CODEMAP[e.code];
  if (k && k in held) held[k] = false;
});
window.addEventListener('blur', function () { for (const k in held) held[k] = false; });

// touch / mouse on the screen itself: tap = confirm (or menu hit), drag = move soul while dodging
let drag = null;
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  ensureAudio();
  const r = cv.getBoundingClientRect();
  const sx = W / r.width, sy = H / r.height;
  const lx = (e.clientX - r.left) * sx, ly = (e.clientY - r.top) * sy;
  drag = { x: e.clientX, y: e.clientY, sx: sx, sy: sy };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  tapScreen(lx, ly);
});
cv.addEventListener('pointermove', function (e) {
  if (!drag) return;
  const dx = (e.clientX - drag.x) * drag.sx, dy = (e.clientY - drag.y) * drag.sy;
  drag.x = e.clientX; drag.y = e.clientY;
  dragSoul(dx, dy);
});
['pointerup', 'pointercancel'].forEach(function (n) {
  cv.addEventListener(n, function () { drag = null; });
});
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- typewriter ---------- */
const typer = { text: '', pos: 0, done: true, acc: 0, blip: 520 };
function typeStart(t, blip) {
  typer.text = t; typer.pos = 0; typer.acc = 0; typer.done = !t; typer.blip = blip || 520;
}
function typeUpdate(dt) {
  if (typer.done) return;
  typer.acc += dt * 40;
  while (typer.acc >= 1 && !typer.done) {
    typer.acc -= 1;
    typer.pos++;
    const ch = typer.text[typer.pos - 1];
    if (ch && ch !== ' ' && ch !== '\n' && typer.pos % 2 === 0) beep(typer.blip, 0.03, 'square', 0.02);
    if (typer.pos >= typer.text.length) typer.done = true;
  }
}
function typeSkip() { typer.pos = typer.text.length; typer.done = true; }

function wrap(text, maxW) {
  const out = [];
  const paras = String(text).split('\n');
  for (let p = 0; p < paras.length; p++) {
    let line = '';
    const words = paras[p].split(' ');
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = words[i]; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}
function drawTyped(x, y, w, lh, color) {
  ctx.font = FONT; ctx.fillStyle = color || C.paper; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  let left = typer.pos;
  const lines = wrap(typer.text, w);
  for (let i = 0; i < lines.length; i++) {
    if (left <= 0) break;
    ctx.fillText(lines[i].slice(0, left), x, y + i * lh);
    left -= lines[i].length + 1;
  }
}

/* ---------- draw helpers ---------- */
function panel(x, y, w, h, border) {
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = border || C.paper;
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function txt(s, x, y, color, font, align) {
  ctx.font = font || FONT; ctx.fillStyle = color || C.paper;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillText(s, x, y);
}
function sprite(rows, pal) {
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const ch = rows[j][i];
    if (ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); }
  }
  return c;
}

function drawMoth(c, cx, top, u, t, shake, glow) {
  const fl = Math.sin(t * 4) * 1.4 * u;
  const sx = shake ? rnd(-shake, shake) : 0;
  cx += sx;
  if (glow) {
    c.fillStyle = 'rgba(143,227,208,0.12)';
    c.beginPath(); c.arc(cx, top + 9 * u, 15 * u, 0, Math.PI * 2); c.fill();
  }
  // wings
  for (const side of [-1, 1]) {
    c.fillStyle = '#8f86b8';
    c.beginPath();
    c.moveTo(cx + side * 3 * u, top + 5 * u);
    c.lineTo(cx + side * 14 * u, top + 1 * u + fl);
    c.lineTo(cx + side * 13 * u, top + 10 * u + fl * 0.4);
    c.lineTo(cx + side * 9 * u, top + 15 * u);
    c.lineTo(cx + side * 3 * u, top + 12 * u);
    c.closePath(); c.fill();
    c.fillStyle = '#e8dfc5';
    c.beginPath(); c.arc(cx + side * 9 * u, top + 6 * u + fl * 0.6, 1.6 * u, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#6e6598';
    c.beginPath(); c.arc(cx + side * 7 * u, top + 11 * u, 1 * u, 0, Math.PI * 2); c.fill();
  }
  // body
  c.fillStyle = '#d7c9a8'; c.fillRect(cx - 3 * u, top + 6 * u, 6 * u, 11 * u);
  c.fillStyle = '#bfae88';
  for (let i = 0; i < 3; i++) c.fillRect(cx - 3 * u, top + (9 + i * 3) * u, 6 * u, 0.6 * u);
  // book
  c.fillStyle = '#c4463a'; c.fillRect(cx - 2.5 * u, top + 10 * u, 5 * u, 3.4 * u);
  c.fillStyle = '#f1e6c8'; c.fillRect(cx - 2 * u, top + 10.6 * u, 4 * u, 2.2 * u);
  // head
  c.fillStyle = '#e6dac0'; c.fillRect(cx - 3 * u, top + 1.5 * u, 6 * u, 5 * u);
  // antennae
  c.fillStyle = '#d7c9a8';
  c.fillRect(cx - 3 * u, top + 0.2 * u, 0.8 * u, 1.6 * u); c.fillRect(cx - 4 * u, top - 0.8 * u, 1 * u, 1 * u);
  c.fillRect(cx + 2.2 * u, top + 0.2 * u, 0.8 * u, 1.6 * u); c.fillRect(cx + 3 * u, top - 0.8 * u, 1 * u, 1 * u);
  // glasses
  c.strokeStyle = '#241a33'; c.lineWidth = Math.max(1, 0.5 * u);
  c.strokeRect(cx - 2.6 * u, top + 2.6 * u, 2.2 * u, 2 * u);
  c.strokeRect(cx + 0.4 * u, top + 2.6 * u, 2.2 * u, 2 * u);
  c.fillStyle = '#241a33';
  c.fillRect(cx - 1.8 * u, top + 3.3 * u, 0.9 * u, 0.9 * u); c.fillRect(cx + 1.0 * u, top + 3.3 * u, 0.9 * u, 0.9 * u);
  c.fillRect(cx - 0.8 * u, top + 5.5 * u, 1.6 * u, 0.5 * u);
}

function tileAt(room, tx, ty) {
  const m = ROOMS[room].map;
  if (ty < 0 || ty >= m.length || tx < 0 || tx >= m[0].length) return '#';
  return m[ty][tx];
}
const solidTile = (ch) => ch === '#' || ch === 'B' || ch === 'T' || ch === 'C' || ch === 'P' || ch === 'V';

    when: function () { return !G[flag]; },
    talk: function () { G[flag] = true; if (give) give(); beep(740, 0.15, 'triangle', 0.05, 240); return lines; } };

function entsHere() {
  const a = G.ents[G.room], out = [];
  for (let i = 0; i < a.length; i++) { const e = a[i]; if (!e.when || e.when()) out.push(e); }
  return out;
}

function boxHitsEnt(x, y, e) {
  return x - 4 < e.x + e.hw && x + 4 > e.x - e.hw && y - 6 < e.y + e.hh && y > e.y - e.hh;
}
function blocked(x, y) {
  const pts = [[x - 4, y - 6], [x + 4, y - 6], [x - 4, y], [x + 4, y]];
  for (let i = 0; i < pts.length; i++) {
    const ch = tileAt(G.room, Math.floor(pts[i][0] / TS), Math.floor(pts[i][1] / TS));
    if (solidTile(ch)) return true;
  }
  const es = entsHere();
  for (let i = 0; i < es.length; i++) {
    const e = es[i];
    if (e.solid && !e.done && boxHitsEnt(x, y, e)) return true;
  }
  return false;
}

function enterRoom(room, x, y) {
  G.room = room; G.px = x; G.py = y; G.fade = 1;
  for (const k in held) held[k] = false;
  const r = ROOMS[room];
  if (r.chapter && !G.seen[room]) {
    G.seen[room] = 1;
    startCard('ГЛАВА ' + r.chapter.n, r.chapter.t, r.chapter.s, function () { if (r.intro) startDialog(r.intro); });
  }
  saveGame();
}

function updateWorld(dt) {
  let dx = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  let dy = (held.down ? 1 : 0) - (held.up ? 1 : 0);
  if (dx || dy) {
    const l = Math.hypot(dx, dy); dx /= l; dy /= l;
    if (Math.abs(dx) > Math.abs(dy)) G.dir = dx > 0 ? 'right' : 'left';
    else G.dir = dy > 0 ? 'down' : 'up';
    const sp = 66 * dt;
    const nx = G.px + dx * sp;
    if (!blocked(nx, G.py)) G.px = nx;
    const ny = G.py + dy * sp;
    if (!blocked(G.px, ny)) G.py = ny;
    G.walk += dt;
  }
  // room exits: a door in the top half leads "up", in the bottom half "down"
  const tx = Math.floor(G.px / TS), ty = Math.floor((G.py - 3) / TS);
  if (tileAt(G.room, tx, ty) === 'D') {
    const dirKey = ty < 7 ? 'up' : 'down';
    const ex = ROOMS[G.room].exits[dirKey];
    if (ex) {
      if (ex.need && !ex.need()) {
        G.py += dirKey === 'up' ? 20 : -20;
        beep(140, 0.15, 'square', 0.04);
        startDialog([ex.msg || 'Дверь заперта.']);
        return;
      }
      beep(330, 0.12, 'triangle', 0.04, -80);
      if (dirKey === 'up') enterRoom(ex.to, 152, 14 * TS - 14);
      else enterRoom(ex.to, 152, 2 * TS + 12);
      return;
    }
  }
  // entities
  const es = entsHere();
  for (let i = 0; i < es.length; i++) {
    const e = es[i];
    if (e.cool > 0) e.cool -= dt;
    if (e.wander && !e.done) {
      e.bx = e.x + Math.sin(G.t * 1.3 + e.ph) * e.wander[0];
      e.by = e.y + Math.sin(G.t * 0.9 + e.ph * 1.7) * e.wander[1];
    }
    if (e.enemy && !e.done && e.cool <= 0) {
      const ex = e.bx != null ? e.bx : e.x, ey = e.by != null ? e.by : e.y;
      if (Math.hypot(G.px - ex, G.py - 4 - ey) < e.trigger) { startEncounter(e); return; }
    }
  }
}

function interact() {
  const v = DIRV[G.dir];
  const fx = G.px + v[0] * 12, fy = G.py - 4 + v[1] * 12;
  const es = entsHere();
  let best = null, bd = 1e9;
  for (let i = 0; i < es.length; i++) {
    const e = es[i];
    if (!e.talk || e.done) continue;
    const dx = Math.abs(fx - e.x) - (e.hw + 6), dy = Math.abs(fy - e.y) - (e.hh + 6);
    if (dx < 0 && dy < 0) {
      const d = Math.hypot(fx - e.x, fy - e.y);
      if (d < bd) { bd = d; best = e; }
    }
  }
  if (best) {
    const pages = best.talk();
    startDialog(pages, best.type === 'cat' ? 'Кот-Каталожник' : (best.type === 'moth' ? 'Моль-Библиотекарь' : null));
    saveGame();
  }
}

/* ---------- dialog ---------- */
function startDialog(pages, speaker, cb) {
  G.dialog = { pages: pages, i: 0, speaker: speaker || null, cb: cb || null };
  G.mode = 'dialog';
  for (const k in held) held[k] = false;
  typeStart(pages[0], speaker ? 700 : 520);
}
function pressDialog(k) {
  if (k !== 'z') return;
  const d = G.dialog;
  if (!typer.done) { typeSkip(); return; }
  beep(440, 0.04, 'square', 0.03);
  d.i++;
  if (d.i >= d.pages.length) {
    G.mode = 'world'; G.dialog = null;
    if (d.cb) d.cb();
  } else typeStart(d.pages[d.i], d.speaker ? 700 : 520);
}

/* ---------- drawing the world ---------- */
const BOOKCOL = ['#7a2e3b', '#2f5b6e', '#6e5a2f', '#4a3a78', '#2f6e4c', '#8a4a2a'];
function drawTile(ch, x, y, tx, ty) {
  const pal = ROOMS[G.room].pal || { f1: C.floor1, f2: C.floor2 };
  if (ch === '#') {
    ctx.fillStyle = C.wall; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = C.wallHi; ctx.fillRect(x, y + 7, TS, 1); ctx.fillRect(x + ((ty % 2) ? 4 : 10), y, 1, 7); ctx.fillRect(x + ((ty % 2) ? 12 : 3), y + 8, 1, 8);
  } else if (ch === 'B') {
    ctx.fillStyle = '#2a1d22'; ctx.fillRect(x, y, TS, TS);
    for (let r = 0; r < 2; r++) {
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = BOOKCOL[(tx * 7 + ty * 3 + r * 5 + i * 2) % BOOKCOL.length];
        const h = 5 + ((tx + i + r) % 3);
        ctx.fillRect(x + 1 + i * 3, y + 1 + r * 8 + (6 - h), 2, h);
      }
      ctx.fillStyle = '#4b3338'; ctx.fillRect(x, y + 7 + r * 8, TS, 1);
    }
  } else if (ch === 'C') {
    ctx.fillStyle = '#3a2a20'; ctx.fillRect(x, y, TS, TS);
    for (let r = 0; r < 2; r++) {
      ctx.fillStyle = '#6b4a35'; ctx.fillRect(x + 1, y + 1 + r * 8, TS - 2, 6);
      ctx.fillStyle = '#85603f'; ctx.fillRect(x + 1, y + 1 + r * 8, TS - 2, 1);
      ctx.fillStyle = '#e0c16a'; ctx.fillRect(x + 6, y + 4 + r * 8, 4, 1);
      ctx.fillStyle = '#f1e6c8'; ctx.fillRect(x + 6, y + 2 + r * 8, 4, 1);
    }
  } else if (ch === 'P') {
    ctx.fillStyle = pal.f1; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = '#1f4a2c'; ctx.beginPath(); ctx.arc(x + 8, y + 9, 8, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#2f7a42'; ctx.beginPath(); ctx.arc(x + 6, y + 7, 5, 0, 6.3); ctx.fill();
    ctx.fillStyle = ((tx + ty) % 3) ? '#ff9fb2' : '#ffe08a'; ctx.fillRect(x + 9 + ((tx * 3) % 3), y + 5 + (ty % 3), 2, 2);
  } else if (ch === 'V') {
    ctx.fillStyle = pal.f1; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = '#2b2740'; ctx.fillRect(x + 2, y, TS - 4, TS);
    ctx.fillStyle = '#3d3860'; ctx.fillRect(x + 2, y, 2, TS);
    ctx.fillStyle = '#1b1830'; ctx.fillRect(x + TS - 5, y, 3, TS);
  } else {
    ctx.fillStyle = ((tx + ty) % 2) ? pal.f1 : pal.f2; ctx.fillRect(x, y, TS, TS);
    if (ch === 'T') {
      ctx.fillStyle = '#4a3326'; ctx.fillRect(x, y + 2, TS, 13);
      ctx.fillStyle = '#6b4a35'; ctx.fillRect(x, y + 1, TS, 8);
      ctx.fillStyle = '#85603f'; ctx.fillRect(x, y + 1, TS, 1);
    } else if (ch === 'D') {
      ctx.fillStyle = '#2d2448'; ctx.fillRect(x, y, TS, TS);
      ctx.fillStyle = 'rgba(255,179,71,0.18)'; ctx.fillRect(x + 2, y + 2, TS - 4, TS - 2);
    }
  }
}

function drawEntity(e) {
  const t = G.t;
  if (e.done) return;
  if (e.type === 'pick') {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.14 + 0.1 * Math.sin(t * 4)) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.col; ctx.fillRect(e.x - 3, e.y - 4 + Math.sin(t * 3), 6, 8);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(e.x - 3, e.y - 1 + Math.sin(t * 3), 6, 1);
    return;
  }
  if (e.type === 'pot') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(e.x - 7, e.y + 4, 14, 3);
    ctx.fillStyle = '#b5532f'; ctx.fillRect(e.x - 6, e.y - 4, 12, 10);
    ctx.fillStyle = '#d0683c'; ctx.fillRect(e.x - 7, e.y - 6, 14, 3);
    ctx.fillStyle = '#241a33'; ctx.fillRect(e.x - 3, e.y - 1, 1, 2); ctx.fillRect(e.x + 2, e.y - 1, 1, 2); ctx.fillRect(e.x - 2, e.y + 3, 4, 1);
    ctx.fillStyle = '#6ccf6c'; ctx.fillRect(e.x - 1, e.y - 12 + Math.sin(t * 2), 2, 6); ctx.fillRect(e.x - 4, e.y - 11, 3, 2); ctx.fillRect(e.x + 1, e.y - 12, 3, 2);
    return;
  }
  if (ART_SMALL[e.type]) {
    const ax = e.bx != null ? e.bx : e.x, ay = e.by != null ? e.by : e.y;
    const u = ART_SMALL[e.type];
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(ax - 8 * u, ay + 2, 16 * u, 3);
    drawEnemyArt(ctx, e.type, ax, ay - 17 * u + Math.sin(t * 2 + (e.ph || 0)) * 1.5, u, t, 0, false, 0);
    return;
  }
  if (e.type === 'cat') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(e.x - 7, e.y + 4, 14, 3);
    ctx.drawImage(SPR.cat, Math.round(e.x - 6), Math.round(e.y - 8 + Math.sin(t * 2) * 0.6));
  } else if (e.type === 'lamp') {
    ctx.fillStyle = '#3a3354'; ctx.fillRect(e.x - 1, e.y - 12, 3, 17);
    ctx.fillStyle = '#241a33'; ctx.fillRect(e.x - 4, e.y + 3, 9, 3);
    const f = 3 + Math.sin(t * 9) * 0.8;
    ctx.fillStyle = 'rgba(255,179,71,0.25)'; ctx.beginPath(); ctx.arc(e.x, e.y - 15, 11 + Math.sin(t * 5), 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9a2e'; ctx.fillRect(e.x - 3, e.y - 18, 6, 6);
    ctx.fillStyle = '#ffe08a'; ctx.fillRect(e.x - 1, e.y - 17 - f * 0.3, 3, 4);
  } else if (e.type === 'sign') {
    ctx.fillStyle = '#4a3326'; ctx.fillRect(e.x - 1, e.y, 3, 7);
    ctx.fillStyle = '#85603f'; ctx.fillRect(e.x - 7, e.y - 9, 14, 10);
    ctx.fillStyle = '#f1e6c8'; ctx.fillRect(e.x - 5, e.y - 7, 10, 1); ctx.fillRect(e.x - 5, e.y - 4, 8, 1);
  } else if (e.type === 'book') {
    if (!G.hasBook) {
      ctx.fillStyle = 'rgba(143,227,208,' + (0.25 + 0.15 * Math.sin(t * 4)) + ')';
      ctx.beginPath(); ctx.arc(e.x, e.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c4463a'; ctx.fillRect(e.x - 4, e.y - 3, 8, 6);
      ctx.fillStyle = '#f1e6c8'; ctx.fillRect(e.x - 3, e.y - 2, 6, 4);
    }
  } else if (e.type === 'bunny') {
    const bx = e.bx != null ? e.bx : e.x, by = e.by != null ? e.by : e.y;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(bx - 6, by + 4, 12, 3);
    ctx.drawImage(SPR.bunny, Math.round(bx - 6), Math.round(by - 8 + Math.abs(Math.sin(t * 5)) * -3));
  } else if (e.type === 'moth') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(e.x - 18, e.y + 14, 36, 4);
    drawMoth(ctx, e.x, e.y - 22 + Math.sin(t * 2) * 2, 2, t, 0, false);
  }
}

function drawPlayer() {
  const bob = (held.up || held.down || held.left || held.right) ? Math.sin(G.walk * 16) * 1 : Math.sin(G.t * 3) * 0.5;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(G.px - 5, G.py - 1, 10, 3);

const motes = [];
for (let i = 0; i < 26; i++) motes.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(4, 12), p: rnd(0, 6) });

function drawWorld() {
  const map = ROOMS[G.room].map;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let ty = 0; ty < map.length; ty++) for (let tx = 0; tx < map[ty].length; tx++) drawTile(map[ty][tx], tx * TS, ty * TS, tx, ty);
  const list = entsHere().slice();
  list.push({ type: 'player', y: G.py });
  list.sort((a, b) => (a.by != null ? a.by : a.y) - (b.by != null ? b.by : b.y));
  for (let i = 0; i < list.length; i++) {
    if (list[i].type === 'player') drawPlayer(); else drawEntity(list[i]);
  }
  // dust motes
  ctx.fillStyle = 'rgba(241,230,200,0.35)';
  for (let i = 0; i < motes.length; i++) {
    const m = motes[i];
    ctx.fillRect(Math.round((m.x + Math.sin(G.t * 0.5 + m.p) * 8 + G.t * m.s * 0.3) % W), Math.round((m.y + G.t * m.s * 0.4) % H), 1, 1);
  }
  // lantern light
  const g = ctx.createRadialGradient(G.px, G.py - 6, 40, G.px, G.py - 6, 190);
  g.addColorStop(0, 'rgba(8,5,16,0)');
  g.addColorStop(1, 'rgba(8,5,16,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // HUD
  if (G.mode === 'world') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(6, 6, 104, 32);
    txt(ROOMS[G.room].name, 12, 9, C.paper, FONT_S);
    ctx.fillStyle = '#3a1d1d'; ctx.fillRect(12, 26, 44, 5);
    ctx.fillStyle = C.ember; ctx.fillRect(12, 26, Math.round(44 * G.hp / G.maxHp), 5);
    txt(G.hp + '/' + G.maxHp, 62, 22, C.paper, FONT_S);
  }
}

function addB(b, x, y, vx, vy, r, kind) {
  b.bullets.push({ x: x, y: y, x0: x, y0: y, vx: vx, vy: vy, r: r, kind: kind, age: 0, ph: rnd(0, 6) });
}
const PAT = {
  rain: { dur: 5.5, init: function (s) { s.acc = 0; }, step: function (b, s, dt) {
    s.acc += dt;
    while (s.acc >= 0.33) { s.acc -= 0.33; addB(b, rnd(b.box.x + 8, b.box.x + b.box.w - 8), b.box.y + 2, 0, 56 + rnd(0, 18), 4, b.d.dustKind || 'dust'); }
  } },
  sides: { dur: 5.5, init: function (s) { s.acc = 0.3; s.side = 0; }, step: function (b, s, dt) {
    s.acc += dt;
    while (s.acc >= 0.5) {
      s.acc -= 0.5; s.side ^= 1;
      const y = rnd(b.box.y + 10, b.box.y + b.box.h - 10);
      addB(b, s.side ? b.box.x + b.box.w - 2 : b.box.x + 2, y, s.side ? -62 : 62, 0, 4, b.d.dustKind || 'dust');
    }
  } },
  pages: { dur: 6, init: function (s) { s.acc = 0; }, step: function (b, s, dt) {
    s.acc += dt;
    while (s.acc >= 0.28) { s.acc -= 0.28; addB(b, rnd(b.box.x + 16, b.box.x + b.box.w - 16), b.box.y + 2, 0, 50, 4, 'page'); }
  } },
  spiral: { dur: 6, init: function (s) { s.acc = 0; s.a = rnd(0, 6); }, step: function (b, s, dt) {
    s.acc += dt;
    while (s.acc >= 0.12) {
      s.acc -= 0.12; s.a += 0.55;
      addB(b, b.box.x + b.box.w / 2, b.box.y + 8, Math.cos(s.a) * 44, Math.abs(Math.sin(s.a)) * 44 + 6, 3, 'orb');
    }
  } },
  sweep: { dur: 6.5, init: function (s) { s.i = 0; s.times = [0.5, 2.3, 4.1]; }, step: function (b, s) {
    if (s.i < s.times.length && b.pt >= s.times[s.i]) {
      s.i++;

        if (k >= gap && k < gap + 3) continue;

    }
  } },
  swarm: { dur: 6, init: function (s) { s.acc = 0; s.side = 0; }, step: function (b, s, dt) {
    s.acc += dt;

      s.acc -= 0.4; s.side ^= 1;

    }
  } }
};

function chooseMain() {
  const b = G.b, d = b.d;
  beep(520, 0.05, 'square', 0.04);
  if (b.menu === 0) {
    b.phase = 'attack'; b.boxT = TEXT_BOX; typeStart('');
    b.atk = { x: 24, done: false, t: 0, dmg: 0, miss: false };
  } else if (b.menu === 1) {
    b.list = d.acts.filter(function (a) { return !a.need || G[a.need]; });
    b.phase = 'sub'; b.kind = 'act'; b.sub = 0;
  } else if (b.menu === 2) {
    b.list = Object.keys(G.inv).filter(function (k) { return G.inv[k] > 0; }).map(function (k) { return { key: k, n: ITEMS[k].n + ' x' + G.inv[k] }; });
    if (!b.list.length) { typeStart('Карманы пусты.'); return; }
    b.phase = 'sub'; b.kind = 'item'; b.sub = 0;
  } else {
    b.list = [{ n: 'Пощадить', mercy: true }];
    if (!d.boss) b.list.push({ n: 'Уйти', flee: true });
    b.phase = 'sub'; b.kind = 'mercy'; b.sub = 0;
  }
}

function chooseSub() {
  const b = G.b, d = b.d, a = b.list[b.sub];
  beep(560, 0.05, 'square', 0.04);
  if (b.kind === 'act') {
    let text, m;
    if (a.once && b.used[a.n]) { text = 'Это уже не сработает.'; m = 0; }
    else if (a.seq) {
      const i = b.seqi[a.n] || 0; b.seqi[a.n] = i + 1;
      if (i < a.seq.length) { text = a.seq[i].t; m = a.seq[i].m; } else { text = a.more; m = 4; }
    } else { text = a.t; m = a.m; if (a.once) b.used[a.n] = 1; }
    b.mercy = clamp(b.mercy + m, 0, 100);
    b.phase = 'result'; b.boxT = TEXT_BOX;
    typeStart(text + (b.mercy >= d.mercyNeed && m > 0 ? '\n' + d.name + ' готов к пощаде.' : ''), 560);
  } else if (b.kind === 'item') {
    const it = ITEMS[a.key];
    G.inv[a.key]--;
    const before = G.hp;
    G.hp = Math.min(G.maxHp, G.hp + it.heal);
    beep(700, 0.2, 'triangle', 0.05, 300);
    b.phase = 'result'; b.boxT = TEXT_BOX;
    typeStart('Вы использовали: ' + it.n + '.\nHP +' + (G.hp - before) + '.');
  } else {
    if (a.flee) {
      b.end = 'flee'; b.phase = 'endtext'; typeStart('Вы тихонько отходите в сторону.');
    } else if (b.mercy >= d.mercyNeed) {
      b.end = 'spare'; b.phase = 'endtext'; typeStart(d.spared, 560);
      beep(880, 0.3, 'triangle', 0.05, 200);
    } else {
      b.phase = 'result'; typeStart(d.notReady || 'Вы пытаетесь пощадить ' + d.name + ', но он ещё не готов.');
    }
  }
}

function stopAttack() {
  const b = G.b, a = b.atk;
  if (a.done) return;
  a.done = true; a.t = 0;
  const dist = Math.abs(a.x - 160);
  if (a.x > 296) { a.miss = true; a.dmg = 0; }
  else {
    const frac = clamp(1 - dist / 136, 0.15, 1);
    a.dmg = Math.round(b.d.maxDmg * frac);
  }
  beep(a.miss ? 160 : 300, 0.15, 'square', 0.06, a.miss ? -40 : 200);
  b.slash = 0.5;
}

function pressBattle(k) {
  const b = G.b;
  switch (b.phase) {
    case 'intro':
    case 'result':
    case 'endtext':
      if (k === 'z') {
        if (!typer.done) { typeSkip(); return; }
        if (b.phase === 'intro') toMenu();
        else if (b.phase === 'result') startTalk();
        else finishBattle(b.end);
      }
      break;
    case 'menu':
      if (k === 'left') { b.menu = (b.menu + 3) % 4; beep(400, 0.03, 'square', 0.03); }
      else if (k === 'right') { b.menu = (b.menu + 1) % 4; beep(400, 0.03, 'square', 0.03); }
      else if (k === 'z') chooseMain();
      break;
    case 'sub':
      if (k === 'up' || k === 'left') { b.sub = (b.sub + b.list.length - 1) % b.list.length; beep(400, 0.03, 'square', 0.03); }
      else if (k === 'down' || k === 'right') { b.sub = (b.sub + 1) % b.list.length; beep(400, 0.03, 'square', 0.03); }
      else if (k === 'z') chooseSub();
      else if (k === 'x') { b.phase = 'menu'; }
      break;
    case 'attack':
      if (k === 'z' && !b.atk.done) stopAttack();
      else if (k === 'x' && !b.atk.done) { b.phase = 'menu'; toMenu(); }
      break;
    case 'talk':
      if (k === 'z' && b.pt > 0.5) startDodge();
      break;
  }
}

function tapBattle(lx, ly) {
  const b = G.b;
  if (b.phase === 'menu' && ly >= 194) {
    const i = clamp(Math.floor((lx - 12) / 76), 0, 3);
    if (b.menu === i) chooseMain(); else { b.menu = i; beep(400, 0.03, 'square', 0.03); }
  } else if (b.phase === 'sub') {
    const i = Math.floor((ly - 108) / 17);
    if (ly >= 104 && ly < 170 && i >= 0 && i < b.list.length) {
      if (b.sub === i) chooseSub(); else { b.sub = i; beep(400, 0.03, 'square', 0.03); }
    } else if (ly >= 194) pressBattle('x');
  } else pressBattle('z');
}

/* ---------- update / draw ---------- */
function updateBattle(dt) {
  const b = G.b;
  typeUpdate(dt);
  for (const k of ['x', 'y', 'w', 'h']) b.box[k] += (b.boxT[k] - b.box[k]) * Math.min(1, dt * 10);
  b.shown += (b.hp - b.shown) * Math.min(1, dt * 6);
  if (b.shake > 0) b.shake -= dt;
  if (b.flash > 0) b.flash -= dt;
  if (b.slash > 0) b.slash -= dt;
  for (let i = b.texts.length - 1; i >= 0; i--) { b.texts[i].t -= dt; b.texts[i].y -= 14 * dt; if (b.texts[i].t <= 0) b.texts.splice(i, 1); }

  if (b.phase === 'attack') {
    const a = b.atk;
    if (!a.done) {
      a.x += 215 * dt;
      if (a.x > 300) stopAttack();
    } else {
      a.t += dt;
      if (a.t > 0.25 && !a.applied) {
        a.applied = true;
        if (!a.miss) {
          b.hp = Math.max(0, b.hp - a.dmg); b.shake = 0.4;
          b.texts.push({ x: 160, y: 30, s: String(a.dmg), t: 1, c: C.ember });
          beep(240, 0.12, 'sawtooth', 0.06, -80);
        } else b.texts.push({ x: 160, y: 30, s: 'МИМО', t: 1, c: C.dim });
      }
      if (a.t > 1.1) {
        if (b.hp <= 0) { b.end = 'kill'; b.phase = 'endtext'; typeStart(b.d.killed, 560); b.boxT = TEXT_BOX; beep(150, 0.5, 'sawtooth', 0.06, -90); }
        else startTalk();
      }
    }
  } else if (b.phase === 'talk') {
    b.pt += dt;
    if (b.pt > 1.7) startDodge();
  } else if (b.phase === 'dodge') {
    b.pt += dt;
    const P = PAT[b.pat.id];
    P.step(b, b.pat.s, dt);
    // soul movement
    const sp = 80 * dt;
    let dx = (held.right ? 1 : 0) - (held.left ? 1 : 0), dy = (held.down ? 1 : 0) - (held.up ? 1 : 0);
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    moveSoul(dx * sp, dy * sp);
    if (b.iv > 0) b.iv -= dt;
    for (let i = b.bullets.length - 1; i >= 0; i--) {
      const u = b.bullets[i];
      u.age += dt;
      if (u.kind === 'page') { u.x = u.x0 + Math.sin(u.age * 3 + u.ph) * 12; u.y += u.vy * dt; }
      else if (u.kind === 'moth') { u.x += u.vx * dt; u.y = u.y0 + Math.sin(u.age * 5 + u.ph) * 10; }
      else { u.x += u.vx * dt; u.y += u.vy * dt; }
      if (u.x < b.box.x - 24 || u.x > b.box.x + b.box.w + 24 || u.y > b.box.y + b.box.h + 24 || u.y < b.box.y - 40) { b.bullets.splice(i, 1); continue; }
      if (b.iv <= 0 && Math.hypot(u.x - b.soul.x, u.y - b.soul.y) < u.r + 2.5) { hurtPlayer(b); if (G.mode === 'over') return; }
    }
    if (b.pt >= P.dur) { b.turn++; toMenu(); }
  }
}

function moveSoul(dx, dy) {
  const b = G.b;
  if (!b || b.phase !== 'dodge') return;
  b.soul.x = clamp(b.soul.x + dx, b.box.x + 5, b.box.x + b.box.w - 5);
  b.soul.y = clamp(b.soul.y + dy, b.box.y + 5, b.box.y + b.box.h - 5);
}

function drawBullet(u) {
  if (u.kind === 'dust') { ctx.fillStyle = '#cfc8e6'; ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 6.3); ctx.fill(); ctx.fillStyle = '#8a84a3'; ctx.fillRect(u.x - 1, u.y - 1, 1, 1); }
  else if (u.kind === 'page') { ctx.fillStyle = C.paper; ctx.fillRect(u.x - 3, u.y - 4, 7, 9); ctx.fillStyle = '#8d85a8'; ctx.fillRect(u.x - 2, u.y - 2, 5, 1); ctx.fillRect(u.x - 2, u.y, 5, 1); }
  else if (u.kind === 'book') { ctx.fillStyle = BOOKCOL[Math.floor(u.x / 12) % BOOKCOL.length]; ctx.fillRect(u.x - 5, u.y - 4, 10, 9); ctx.fillStyle = C.paper; ctx.fillRect(u.x - 4, u.y + 2, 8, 1); }
  else if (u.kind === 'ink') { ctx.fillStyle = '#3a3f9a'; ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 6.3); ctx.fill(); ctx.fillStyle = '#7f86e0'; ctx.fillRect(u.x - 2, u.y - 2, 1, 1); }
  else if (u.kind === 'petal') { ctx.fillStyle = (Math.floor(u.age * 3 + u.ph) % 2) ? '#ff9fb2' : '#ffe08a'; ctx.beginPath(); ctx.ellipse(u.x, u.y, u.r, u.r * 0.6, u.age * 4, 0, 6.3); ctx.fill(); }
  else if (u.kind === 'thorn') { ctx.fillStyle = '#6ccf6c'; ctx.beginPath(); ctx.moveTo(u.x, u.y - 5); ctx.lineTo(u.x + 3, u.y + 3); ctx.lineTo(u.x - 3, u.y + 3); ctx.closePath(); ctx.fill(); }
  else if (u.kind === 'drawer') { ctx.fillStyle = '#7a5236'; ctx.fillRect(u.x - 5, u.y - 4, 10, 8); ctx.fillStyle = '#e0c16a'; ctx.fillRect(u.x - 2, u.y - 1, 4, 2); }
  else if (u.kind === 'wisp') { ctx.fillStyle = 'rgba(241,230,200,0.85)'; ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 6.3); ctx.fill(); ctx.fillStyle = 'rgba(207,200,230,0.4)'; ctx.beginPath(); ctx.arc(u.x, u.y, u.r + 2, 0, 6.3); ctx.fill(); }
  else if (u.kind === 'orb') { ctx.fillStyle = '#ffb0e0'; ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, 6.3); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(u.x - 1, u.y - 1, 1, 1); }
  else { ctx.fillStyle = '#b9a8e8'; ctx.fillRect(u.x - 1, u.y - 2, 2, 5); const w = Math.sin(u.age * 20) * 2; ctx.fillRect(u.x - 5, u.y - 3 + w, 4, 3); ctx.fillRect(u.x + 1, u.y - 3 + w, 4, 3); }
}

function drawBattle() {
  const b = G.b, d = b.d;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // faint library backdrop
  ctx.fillStyle = '#100c1a';
  for (let i = 0; i < 8; i++) ctx.fillRect(i * 44 + 6, 0, 30, 96);
  // enemy
  const hit = b.shake > 0 ? 5 : 0;
  if (b.hp > 0 || b.phase === 'attack') {
    const wob = Math.sin(G.t * 2) * 2;
    if (b.id === 'moth') drawMoth(ctx, 160, 14 + wob, 4, G.t, hit, b.mercy >= d.mercyNeed);
    else if (b.id === 'bunny') {
      const sx = hit ? rnd(-hit, hit) : 0;
      if (b.mercy >= d.mercyNeed) { ctx.fillStyle = 'rgba(143,227,208,0.15)'; ctx.beginPath(); ctx.arc(160, 52, 40, 0, 6.3); ctx.fill(); }
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(SPR.bunny, 130 + sx, 22 + wob + Math.abs(Math.sin(G.t * 4)) * -4, 60, 50);
    } else drawEnemyArt(ctx, b.id, 160, 12 + wob, d.u || 4, G.t, hit, b.mercy >= d.mercyNeed, b.mercy / 100);
  }
  // name + bars (top-left)
  txt(d.name, 8, 6, b.mercy >= d.mercyNeed ? C.mercy : C.paper, FONT_S);
  ctx.fillStyle = '#3a1d1d'; ctx.fillRect(8, 20, 60, 5);
  ctx.fillStyle = C.danger; ctx.fillRect(8, 20, Math.round(60 * Math.max(0, b.shown) / d.hp), 5);
  txt('HP', 72, 17, C.dim, FONT_S);
  ctx.fillStyle = '#16302c'; ctx.fillRect(8, 30, 60, 5);
  ctx.fillStyle = C.mercy; ctx.fillRect(8, 30, Math.round(60 * b.mercy / 100), 5);
  txt('ДОВЕРИЕ', 72, 27, C.dim, FONT_S);
  // slash
  if (b.slash > 0 && b.atk && !b.atk.miss) {
    ctx.strokeStyle = C.ember; ctx.lineWidth = 3;
    const p = 1 - b.slash / 0.5;
    ctx.beginPath(); ctx.moveTo(120, 20 + p * 10); ctx.lineTo(120 + p * 80, 20 + p * 60); ctx.stroke();
  }
  // enemy speech
  if (b.phase === 'talk') {
    ctx.fillStyle = '#f5f0e0'; ctx.fillRect(220, 16, 90, 40);
    ctx.fillRect(214, 36, 8, 6);
    ctx.fillStyle = '#241a33'; ctx.font = FONT_S; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const lines = wrap(b.talk, 78);
    for (let i = 0; i < Math.min(3, lines.length); i++) ctx.fillText(lines[i], 226, 21 + i * 11);
  }
  // box
  const bx = b.box;
  ctx.fillStyle = '#000'; ctx.fillRect(bx.x, bx.y, bx.w, bx.h);
  ctx.strokeStyle = C.paper; ctx.lineWidth = 3; ctx.strokeRect(bx.x - 1.5, bx.y - 1.5, bx.w + 3, bx.h + 3);

  if (b.phase === 'intro' || b.phase === 'menu' || b.phase === 'result' || b.phase === 'endtext') {
    drawTyped(bx.x + 12, bx.y + 10, bx.w - 24, 15, C.paper);
  } else if (b.phase === 'sub') {
    for (let i = 0; i < b.list.length; i++) {
      const y = bx.y + 8 + i * 17;
      const sel = i === b.sub;
      const col = b.kind === 'mercy' && b.list[i].mercy && b.mercy >= d.mercyNeed ? C.mercy : (sel ? C.ember : C.paper);
      if (sel) ctx.drawImage(SPR.soul, bx.x + 12, y + 1);
      txt(b.list[i].n, bx.x + 28, y, col, FONT);
    }
  } else if (b.phase === 'attack') {
    const a = b.atk;
    ctx.fillStyle = '#2a2340'; ctx.fillRect(24, 118, 272, 34);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i === 3 || i === 2 ? '#3d6f4a' : '#26213a'; }
    ctx.fillStyle = '#3a3354'; ctx.fillRect(24, 118, 272, 34);
    ctx.fillStyle = '#4b7a4f'; ctx.fillRect(130, 118, 60, 34);
    ctx.fillStyle = '#7ec27f'; ctx.fillRect(150, 118, 20, 34);
    ctx.fillStyle = '#241a33'; ctx.fillRect(159, 118, 2, 34);
    ctx.fillStyle = a.done ? C.ember : C.paper; ctx.fillRect(Math.round(a.x) - 2, 114, 4, 42);
    txt('Нажмите ОК в зелёной зоне', 160, 160, C.dim, FONT_S, 'center');
  } else if (b.phase === 'dodge' || b.phase === 'talk') {
    for (let i = 0; i < b.bullets.length; i++) drawBullet(b.bullets[i]);
    if (b.phase === 'dodge') {
      const vis = b.iv <= 0 || Math.floor(G.t * 16) % 2 === 0;
      if (vis) ctx.drawImage(SPR.soul, Math.round(b.soul.x - 3.5), Math.round(b.soul.y - 4));
    }
  }
  // damage numbers
  for (let i = 0; i < b.texts.length; i++) { const t = b.texts[i]; txt(t.s, t.x, t.y, t.c, FONT_L.replace('30px', '18px'), 'center'); }

  // bottom UI
  txt('ФИТИЛЬ', 16, 179, C.paper, FONT_S);
  txt('HP', 96, 179, C.dim, FONT_S);
  ctx.fillStyle = '#3a1d1d'; ctx.fillRect(112, 180, 64, 9);
  ctx.fillStyle = C.ember; ctx.fillRect(112, 180, Math.round(64 * G.hp / G.maxHp), 9);
  txt(G.hp + ' / ' + G.maxHp, 184, 179, C.paper, FONT_S);
  for (let i = 0; i < 4; i++) {
    const x = 12 + i * 76, sel = b.phase === 'menu' && b.menu === i;
    ctx.strokeStyle = sel ? C.ember : '#5c5478'; ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, 199, 70, 28);
    if (sel) ctx.drawImage(SPR.soul, x + 6, 209);
    txt(MENU[i], x + (sel ? 40 : 36), 207, sel ? C.ember : C.paper, FONT_S, 'center');
  }
  if (b.flash > 0) { ctx.fillStyle = 'rgba(255,60,60,' + (b.flash * 1.6) + ')'; ctx.fillRect(0, 0, W, H); }
}

/* extra attack patterns */
PAT.drawers = { dur: 7, init: function (s) { s.acc = 0.4; s.side = 0; }, step: function (b, s, dt) {
  s.acc += dt;
  if (s.acc >= 1.15) {
    s.acc = 0; s.side ^= 1;
    const n = Math.floor((b.box.h - 12) / 9);
    const gap = 1 + Math.floor(Math.random() * (n - 4));
    for (let k = 0; k < n; k++) {
      if (k >= gap && k < gap + 3) continue;
      addB(b, s.side ? b.box.x + b.box.w - 2 : b.box.x + 2, b.box.y + 8 + k * 9, s.side ? -50 : 50, 0, 4.5, 'drawer');
    }
  }
} };
PAT.vines = { dur: 6, init: function (s) { s.acc = 0; }, step: function (b, s, dt) {
  s.acc += dt;
  while (s.acc >= 0.32) { s.acc -= 0.32; addB(b, rnd(b.box.x + 8, b.box.x + b.box.w - 8), b.box.y + b.box.h - 2, 0, -(52 + rnd(0, 20)), 3.5, 'thorn'); }
} };
PAT.rings = { dur: 6.5, init: function (s) { s.acc = 0.6; s.a0 = 0; }, step: function (b, s, dt) {
  s.acc += dt;
  if (s.acc >= 1.25) {
    s.acc = 0; s.a0 += 0.4;
    const cx = b.box.x + b.box.w / 2 + rnd(-26, 26), cy = b.box.y + 10;
    for (let k = 0; k < 9; k++) {
      const a = s.a0 + k * Math.PI * 2 / 9;
      addB(b, cx, cy, Math.cos(a) * 40, Math.abs(Math.sin(a)) * 40 + 4, 3, b.d.orbKind || 'orb');
    }
  }
} };

/* enemy art: each fits roughly a 28u x 18u box, origin (cx, top) */
const ART_SMALL = { blot: 0.85, sprout: 0.85, hush: 0.85, clerk: 1.2, gardener: 1.1, silence: 1.2 };

function drawEnemyArt(c, id, cx, top, u, t, shake, glow, frac) {
  cx += shake ? rnd(-shake, shake) : 0;
  const mid = top + 9 * u;
  if (glow) {
    c.fillStyle = 'rgba(143,227,208,0.14)';
    c.beginPath(); c.arc(cx, mid, 15 * u, 0, Math.PI * 2); c.fill();
  }
  const bob = Math.sin(t * 3);
  if (id === 'blot') {
    c.fillStyle = '#2b2f6b';
    c.beginPath(); c.ellipse(cx, top + 11 * u, 9 * u, (6.5 + bob * 0.5) * u, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx - 6.5 * u, top + 14.5 * u, 3 * u, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx + 6.5 * u, top + 14.5 * u, 3 * u, 0, Math.PI * 2); c.fill();
    c.fillRect(cx + 2 * u, top + 15 * u, 1.8 * u, (3 + Math.abs(bob)) * u);
    c.fillStyle = '#4b52a8'; c.beginPath(); c.ellipse(cx - 3.5 * u, top + 8 * u, 3 * u, 1.4 * u, -0.3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(cx - 3 * u, top + 10.5 * u, 1.8 * u, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx + 3 * u, top + 10.5 * u, 1.8 * u, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#0b0812';
    c.beginPath(); c.arc(cx - 2.6 * u, top + 10.8 * u, 0.8 * u, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx + 3.4 * u, top + 10.8 * u, 0.8 * u, 0, Math.PI * 2); c.fill();
  } else if (id === 'clerk') {
    const w = 16 * u, x0 = cx - w / 2;
    c.fillStyle = '#3a2518'; c.fillRect(x0 - 0.6 * u, top + 0.4 * u, w + 1.2 * u, 17.8 * u);
    c.fillStyle = '#5b3d2a'; c.fillRect(x0, top + 1 * u, w, 17 * u);
    for (let i = 0; i < 3; i++) {
      const off = i === 1 ? Math.sin(t * 2) * 1.6 * u : 0;
      const y = top + (1.6 + i * 5.6) * u;
      if (i === 1) { c.fillStyle = '#f1e6c8'; c.fillRect(x0 + 2 * u + off, y - 1.2 * u, 12 * u, 1.4 * u); }
      c.fillStyle = '#7a5236'; c.fillRect(x0 + 0.8 * u + off, y, w - 1.6 * u, 5 * u);
      c.fillStyle = '#8f6445'; c.fillRect(x0 + 0.8 * u + off, y, w - 1.6 * u, 0.8 * u);
      c.fillStyle = '#e0c16a'; c.fillRect(cx - 1.6 * u + off, y + 3.4 * u, 3.2 * u, 0.8 * u);
      c.fillStyle = '#f1e6c8'; c.fillRect(cx - 1.2 * u + off, y + 2 * u, 2.4 * u, 1 * u);
    }
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(cx - 2.6 * u, top + 3.6 * u, 1.4 * u, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx + 2.6 * u, top + 3.6 * u, 1.4 * u, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#0b0812';
    c.beginPath(); c.arc(cx - 2.3 * u, top + 3.8 * u, 0.6 * u, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx + 2.9 * u, top + 3.8 * u, 0.6 * u, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#e0c16a'; c.lineWidth = Math.max(1, 0.4 * u);
    c.beginPath(); c.arc(cx + 2.6 * u, top + 3.6 * u, 1.9 * u, 0, Math.PI * 2); c.stroke();
    c.strokeStyle = '#3a2518'; c.lineWidth = Math.max(1, 0.9 * u);
    for (const sd of [-1, 1]) {
      c.beginPath(); c.moveTo(cx + sd * 8 * u, top + 8 * u); c.lineTo(cx + sd * 12 * u, top + (10.5 + bob) * u); c.stroke();
      c.fillStyle = '#f1e6c8'; c.fillRect(cx + sd * 12 * u - 0.8 * u, top + (10.5 + bob) * u - 0.8 * u, 1.6 * u, 1.6 * u);
    }
  } else if (id === 'sprout') {
    c.fillStyle = '#b5532f'; c.fillRect(cx - 5 * u, top + 13 * u, 10 * u, 5 * u);
    c.fillStyle = '#d0683c'; c.fillRect(cx - 6 * u, top + 12 * u, 12 * u, 1.8 * u);
    c.fillStyle = '#4c9a4e'; c.beginPath(); c.arc(cx, top + 8.5 * u, 5 * u, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#6ccf6c';
    const lf = bob * 1.2 * u;
    c.beginPath(); c.moveTo(cx, top + 4 * u); c.lineTo(cx - 7 * u, top - 0.5 * u + lf); c.lineTo(cx - 2 * u, top + 5 * u); c.fill();
    c.beginPath(); c.moveTo(cx, top + 4 * u); c.lineTo(cx + 7 * u, top - 0.5 * u - lf); c.lineTo(cx + 2 * u, top + 5 * u); c.fill();
    c.fillStyle = '#fff'; c.fillRect(cx - 3 * u, top + 7.5 * u, 2 * u, 2 * u); c.fillRect(cx + 1 * u, top + 7.5 * u, 2 * u, 2 * u);
    c.fillStyle = '#0b0812'; c.fillRect(cx - 2 * u, top + 8.2 * u, 1 * u, 1.2 * u); c.fillRect(cx + 1.6 * u, top + 8.2 * u, 1 * u, 1.2 * u);
    c.strokeStyle = '#0b0812'; c.lineWidth = Math.max(1, 0.6 * u);
    c.beginPath(); c.moveTo(cx - 3.4 * u, top + 6.6 * u); c.lineTo(cx - 0.6 * u, top + 7.4 * u); c.stroke();
    c.beginPath(); c.moveTo(cx + 3.4 * u, top + 6.6 * u); c.lineTo(cx + 0.6 * u, top + 7.4 * u); c.stroke();
  } else if (id === 'gardener') {
    c.fillStyle = '#4a7a50';
    c.beginPath(); c.moveTo(cx - 6 * u, top + 11 * u); c.lineTo(cx + 6 * u, top + 11 * u); c.lineTo(cx + 9 * u, top + 18 * u); c.lineTo(cx - 9 * u, top + 18 * u); c.closePath(); c.fill();
    const fc = ['#ff9fb2', '#ffe08a', '#9fb8ff', '#ff7a6b', '#f1e6c8'];
    for (let i = 0; i < 10; i++) { c.fillStyle = fc[i % 5]; c.fillRect(cx + (((i * 37) % 15) - 7.5) * u, top + (12.5 + (i * 7) % 5) * u, 1.6 * u, 1.6 * u); }
    c.fillStyle = '#e6d2b0'; c.fillRect(cx - 4 * u, top + 5 * u, 8 * u, 6.4 * u);
    c.fillStyle = '#241a33'; c.fillRect(cx - 2.4 * u, top + 7.4 * u, 1.1 * u, 1.1 * u); c.fillRect(cx + 1.3 * u, top + 7.4 * u, 1.1 * u, 1.1 * u);
    c.fillRect(cx - 1.4 * u, top + 9.4 * u, 2.8 * u, 0.6 * u);
    c.fillStyle = '#d8b45a'; c.beginPath(); c.ellipse(cx, top + 4.8 * u, 12 * u, 2 * u, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#e6c46c'; c.fillRect(cx - 5 * u, top + 0.2 * u, 10 * u, 4.6 * u);
    c.fillStyle = '#c4463a'; c.fillRect(cx - 5 * u, top + 3.2 * u, 10 * u, 1.2 * u);
    c.fillStyle = '#6aa6b8'; c.fillRect(cx + 9 * u, top + 11.5 * u, 5 * u, 3.6 * u);
    c.strokeStyle = '#6aa6b8'; c.lineWidth = Math.max(1, 0.7 * u);
    c.beginPath(); c.moveTo(cx + 9 * u, top + 12.5 * u); c.lineTo(cx + 6.5 * u, top + 11 * u); c.stroke();
    c.fillStyle = '#6fe0ff';
    for (let i = 0; i < 3; i++) { const q = (t * 1.5 + i / 3) % 1; c.fillRect(cx + 12 * u + i * 0.3 * u, top + (15.5 + q * 3) * u, 0.7 * u, 0.9 * u); }
  } else if (id === 'hush') {
    c.globalAlpha = 0.8;
    c.fillStyle = '#cfc8e6';
    c.beginPath(); c.arc(cx, top + 7 * u, 6 * u, Math.PI, 0); c.lineTo(cx + 6 * u, top + 15 * u);
    for (let i = 0; i < 4; i++) c.lineTo(cx + (6 - (i + 1) * 3) * u, top + (18 + (i % 2 ? -1.5 : 0.5) + Math.sin(t * 4 + i) * 0.8) * u);
    c.lineTo(cx - 6 * u, top + 7 * u); c.closePath(); c.fill();
    c.fillStyle = '#241a33';
    c.beginPath(); c.ellipse(cx - 2.4 * u, top + 6.4 * u, 1 * u, 1.6 * u, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(cx + 2.4 * u, top + 6.4 * u, 1 * u, 1.6 * u, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(cx, top + 10.5 * u, 1.3 * u, (1.6 + Math.abs(bob)) * u, 0, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
  } else if (id === 'silence') {
    c.strokeStyle = '#8d85a8'; c.lineWidth = Math.max(1, 0.7 * u);
    c.beginPath(); c.arc(cx, mid, 11.5 * u, 0, Math.PI * 2); c.stroke();
    c.fillStyle = '#05030a'; c.beginPath(); c.arc(cx, mid, 10.5 * u, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f1e6c8';
    for (let i = 0; i < 7; i++) { const a = t * 0.7 + i * 0.9; c.fillRect(cx + Math.cos(a) * 13.5 * u, mid + Math.sin(a) * 13.5 * u, 0.9 * u, 0.9 * u); }
    c.fillStyle = '#f1e6c8'; c.fillRect(cx - 4 * u, mid - 5.5 * u, 8 * u, 11 * u);
    c.fillStyle = '#d9cdb0'; c.fillRect(cx - 4 * u, mid - 5.5 * u, 8 * u, 0.8 * u);
    const lines = Math.round((frac || 0) * 6);
    c.fillStyle = '#4fb8a0';
    for (let i = 0; i < lines; i++) c.fillRect(cx - 3 * u, mid - 4 * u + i * 1.6 * u, (5 - (i % 3)) * u, 0.7 * u);
    if (!lines) { c.fillStyle = '#241a33'; c.beginPath(); c.arc(cx, mid, 1.1 * u, 0, Math.PI * 2); c.fill(); }
  }
}

/* ---------- save / load ---------- */
const SAVE_KEY = 'pylny_archiv_save_v2';
const SAVE_FIELDS = ['hp', 'maxHp', 'inv', 'hasBook', 'gotTea', 'hasCard', 'hasFlower', 'hasWater', 'gotHoney', 'gotTea2', 'log', 'done', 'seen', 'tally', 'room', 'respawn'];
function saveGame() {
  if (G.mode === 'title' || G.mode === 'ending' || G.mode === 'over') return;
  try {
    const o = {};
    SAVE_FIELDS.forEach(function (k) { o[k] = G[k]; });
    o.px = G.px; o.py = G.py;
    localStorage.setItem(SAVE_KEY, JSON.stringify(o));
  } catch (e) {}
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    SAVE_FIELDS.forEach(function (k) { if (o[k] !== undefined) G[k] = o[k]; });
    G.px = o.px; G.py = o.py;
    return true;
  } catch (e) { return false; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
G.hasSave = loadSave();

/* ---------- chapter cards ---------- */
function startCard(head, title, sub, cb) {
  G.card = { t: 0, head: head, title: title, sub: sub, cb: cb };
  G.mode = 'card';
  for (const k in held) held[k] = false;
  beep(392, 0.4, 'triangle', 0.04, 100);
}
function endCard() {
  const cb = G.card.cb;
  G.card = null; G.mode = 'world';
  if (cb) cb();
}
function drawCard() {
  const c = G.card;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const a = Math.min(1, c.t / 0.6) * Math.min(1, Math.max(0, (3.2 - c.t) / 0.5));
  ctx.globalAlpha = a;
  txt(c.head, 160, 82, C.ember, '14px ' + FF, 'center');
  txt(c.title, 160, 106, C.paper, '24px ' + FF, 'center');
  txt(c.sub, 160, 146, C.dim, FONT_S, 'center');
  ctx.globalAlpha = 1;
}

/* ---------- title / ending / game over ---------- */
function resetState() {
  G.hp = 20; G.maxHp = 20; G.inv = { tea: 2, cookie: 1 }; G.hasBook = false; G.gotTea = false;
  G.hasCard = false; G.hasFlower = false; G.hasWater = false; G.gotHoney = false; G.gotTea2 = false;
  G.log = {}; G.done = {}; G.seen = {}; G.tally = { spare: 0, kill: 0 };
  G.room = 'hall'; G.px = 152; G.py = 200; G.dir = 'up'; G.walk = 0;
  G.respawn = { room: 'hall', x: 152, y: 200 };
}
function afterLoad() {
  G.ents = makeEntities(); G.b = null; G.trans = null; G.end = null; G.over = null; G.fade = 1; G.card = null;
  track = 'world'; G.mode = 'world';
}
function newGame() {
  clearSave(); resetState(); afterLoad();
  G.seen.hall = 1;
  startCard('ГЛАВА 1', 'Пыльный архив', 'Огонёк, лампа и очень много тишины.', function () {

function startEnding(kind) {

    if (kills <= 0) {
      title = 'ПОСЛЕДНЯЯ СТРАНИЦА';
      pages = ['На пустой странице проступают слова. Все до единого.', 'Тишина читает их вслух. Её голос похож на шелест тысячи страниц.', 'Лампы вспыхивают одна за другой: в Хранилище, в оранжерее, в подвале, в читальном зале, в прихожей.', 'Моль открывает окна. Кот мурлычет. Каталожник ищет номер для вашей карточки.', 'Архив снова говорит. И вы теперь часть его истории.'];
    } else {
      title = 'ТИХИЙ КОМПРОМИСС';

function pressEnding(k) {

    txt('ОК — продолжить', 160, 190, C.paper, FONT, 'center');
    txt('НАЗАД — новая игра', 160, 208, C.dim, FONT_S, 'center');
  } else if (Math.floor(G.t * 2) % 2 === 0) txt('нажмите ОК', 160, 196, C.paper, FONT, 'center');
}

function drawOver() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const o = G.over;
  const a = Math.min(1, o.t / 1.2);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#3a3354'; ctx.fillRect(156, 90, 8, 10);
  txt('ПЛАМЯ ПОГАСЛО', 160, 60, C.danger, '22px ' + FF, 'center');
  txt('Но лампа ещё тёплая.', 160, 128, C.dim, FONT, 'center');
  if (o.t > 1.4 && Math.floor(G.t * 2) % 2 === 0) txt('ОК — вернуться к лампе', 160, 190, C.paper, FONT, 'center');
  ctx.globalAlpha = 1;
}
function pressOver(k) {
  if (k !== 'z' || G.over.t < 1.4) return;
  G.hp = G.maxHp; G.over = null; G.b = null; G.mode = 'world'; track = 'world';
  const r = G.respawn;
  enterRoom(r.room, r.x, r.y);
  for (const k2 in G.ents) G.ents[k2].forEach(function (e) { if (e.enemy && !e.done) e.cool = 2.5; });
  saveGame();
}

/* ---------- dispatch ---------- */
function press(k) {
  switch (G.mode) {
    case 'title':
      if (k === 'z') { beep(660, 0.15, 'triangle', 0.05, 200); if (G.hasSave) continueGame(); else newGame(); }
      else if (k === 'x' && G.hasSave) { beep(330, 0.15, 'triangle', 0.05, -100); newGame(); }
      break;
    case 'card': if (k === 'z' && G.card.t > 0.8) endCard(); break;
    case 'world': if (k === 'z') interact(); break;
    case 'dialog': pressDialog(k); break;
    case 'battle': pressBattle(k); break;
    case 'ending': pressEnding(k); break;
    case 'over': pressOver(k); break;
  }
}
function tapScreen(lx, ly) {
  if (G.mode === 'battle') {
    if (G.b.phase === 'dodge') return;
    tapBattle(lx, ly);
  } else if (G.mode !== 'trans') press('z');
}
function dragSoul(dx, dy) {
  if (G.mode === 'battle') moveSoul(dx * 1.15, dy * 1.15);
}

/* ---------- loop ---------- */
function update(dt) {
  G.t += dt;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt * 3);
  switch (G.mode) {
    case 'world': updateWorld(dt); break;
    case 'dialog': typeUpdate(dt); break;
    case 'card':
      G.card.t += dt;
      if (G.card.t > 3.2) endCard();
      break;
    case 'trans':
      G.trans.t += dt;
      if (G.trans.t > 0.8) startBattle(G.trans.ent);
      break;
    case 'battle': updateBattle(dt); break;
    case 'ending': typeUpdate(dt); break;
    case 'over': G.over.t += dt; break;
  }
}

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  switch (G.mode) {
    case 'title': drawTitle(); break;
    case 'card': drawCard(); break;
    case 'world': drawWorld(); break;
    case 'dialog': drawWorld(); drawDialog(); break;
    case 'trans': {
      drawWorld();
      const p = G.trans.t / 0.8;
      if (Math.floor(G.trans.t * 14) % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, 0, W, H); }
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, p * 1.2) + ')'; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(SPR.soul, G.px - 3, G.py - 14 + (130 - G.py + 14) * p * p);
      break;
    }
    case 'battle': drawBattle(); break;
    case 'ending': drawEnding(); break;
    case 'over': drawOver(); break;
  }
  if (G.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + G.fade + ')'; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  try { update(dt); render(); } catch (err) { if (window.console) console.error(err); }
  requestAnimationFrame(frame);
}
try { if (document.fonts && document.fonts.load) { document.fonts.load('12px "Pixelify Sans"', 'Аа'); document.fonts.load('600 12px "Pixelify Sans"', 'Аа'); } } catch (e) {}
window.__game = { G: G, press: press, update: update, render: render, ENEMIES: ENEMIES };
requestAnimationFrame(frame);

})();
</script>
